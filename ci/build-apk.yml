name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - main
    paths-ignore:
      - "apk/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (copia web assets + plugins)
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK al repositorio
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/templo-mistico-crm-debug.apk
          ls -la apk/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: templo-mistico-crm-debug
          path: apk/templo-mistico-crm-debug.apk

      - name: Commit del APK a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/templo-mistico-crm-debug.apk
          if git diff --cached --quiet; then
            echo "APK sin cambios, nada que commitear"
          else
            git commit -m "build: APK debug generado automáticamente [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
