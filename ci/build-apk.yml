# ══════════════════════════════════════════════════════════════════════════
# BUILD APK — workflow de compilación automática
# ══════════════════════════════════════════════════════════════════════════
# ⚠️ PARA ACTIVARLO (una sola vez): GitHub Actions SÓLO ejecuta workflows que
# estén en `.github/workflows/`; desde `ci/` nunca corre (por eso no se
# ejecutaba). Además, GitHub bloquea a las GitHub Apps sin permiso
# "workflows" crear archivos en esa carpeta, así que esta única copia hay que
# hacerla tú desde la web o desde tu equipo:
#
#   Opción web (github.com → este repo → Add file → Create new file):
#     1. Nombra el archivo exactamente:  .github/workflows/build-apk.yml
#     2. Pega el contenido COMPLETO de este archivo (ci/build-apk.yml).
#     3. Commit a `main` (o a la rama que quieras construir).
#
#   Opción terminal (con permisos de push en el repo):
#     mkdir -p .github/workflows
#     cp ci/build-apk.yml .github/workflows/build-apk.yml
#     git add .github/workflows/build-apk.yml
#     git commit -m "CI: activar Build APK" && git push
#
# A partir de ese momento, cada push a `main` o a una rama `arena/**`
# compila la APK debug, la sube como artefacto descargable
# (Actions → Build APK → artefacto templo-mistico-crm-debug) y la commitea
# en apk/templo-mistico-crm-debug.apk de la misma rama. También puede
# lanzarse a mano: Actions → Build APK → Run workflow.
# ══════════════════════════════════════════════════════════════════════════

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - main
    paths-ignore:
      - "apk/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Verificación temprana: si el código web no compila, no tiene sentido
      # generar una APK que cargaría una web rota en Vercel.
      - name: Verificar build web
        run: npm run build

      - name: Sync Capacitor (copia web assets + plugins)
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          # Evita reutilizar un APK de una versión anterior.
          ./gradlew clean assembleDebug --no-daemon
          echo "APK versionName: $(grep -n 'versionName' app/build.gradle)"

      - name: Copiar APK al repositorio
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/templo-mistico-crm-debug.apk
          ls -la apk/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: templo-mistico-crm-debug
          path: apk/templo-mistico-crm-debug.apk

      - name: Commit del APK a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/templo-mistico-crm-debug.apk
          if git diff --cached --quiet; then
            echo "APK sin cambios, nada que commitear"
          else
            git commit -m "build: APK debug generado automáticamente [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
