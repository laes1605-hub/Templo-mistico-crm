# Build IPA: compila la app iOS/iPad en cada push a main o a ramas arena/**.
# Debe vivir en .github/workflows/ (GitHub ignora cualquier otra carpeta).
# Resultado: artefacto(s) descargable(s) y commit en ipa/ de la misma rama.
# Lanzable a mano desde Actions -> Build IPA -> Run workflow.
#
# ACTIVACIÓN (1 minuto, una sola vez): la credencial del agente de Arena no
# puede crear archivos en .github/workflows (GitHub lo bloquea para las
# GitHub Apps sin permiso `workflows`), así que cópialo a mano igual que se
# hizo con el workflow de la APK:
#   1. En github.com → este repo → Add file → Create new file.
#   2. Nombre exacto: .github/workflows/build-ipa.yml
#   3. Pega el contenido completo de este archivo y haz commit.
#
# FIRMADO (opcional): por defecto genera un IPA SIN FIRMAR, que se instala
# con Sideloadly/AltStore usando tu Apple ID (ver README-IPA.md). Si tienes
# cuenta Apple Developer y quieres un IPA ad-hoc listo para instalar, define
# estos 4 secrets en Settings -> Secrets and variables -> Actions:
#   APPLE_TEAM_ID                  (ej: A1B2C3D4E5)
#   APPLE_CERTIFICATE_BASE64       (certificado .p12 de distribución en base64)
#   APPLE_CERTIFICATE_PASSWORD     (contraseña de ese .p12)
#   APPLE_PROVISIONING_PROFILE_BASE64 (perfil ad-hoc para com.templomistico.crm,
#                                      con el UDID de tu iPad registrado)

name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - main
    paths-ignore:
      - "ipa/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    env:
      PROJECT: ios/App/App.xcodeproj
      SCHEME: App
      CONFIGURATION: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Seleccionar Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: npm ci

      # Si la web no compila, no generar un IPA que cargaria una web rota.
      - name: Verificar build web
        run: npm run build

      # Invocacion directa del binario (sin capa npx) y, si falla, el error se
      # publica como anotacion del check para poder diagnosticarlo por API.
      - name: Sync Capacitor (copia web assets + plugins)
        run: |
          set -o pipefail
          echo "node $(node -v) | npm $(npm -v) | omit: $(npm config get omit)"
          CAP_BIN="node_modules/@capacitor/cli/bin/capacitor"
          if [ ! -f "$CAP_BIN" ]; then
            echo "::error::No existe $CAP_BIN - revisar npm ci / devDependencies"
            exit 1
          fi
          if node "$CAP_BIN" sync ios 2>&1 | tee /tmp/cap-sync.log; then
            echo "Sync OK"
          else
            tail -c 900 /tmp/cap-sync.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Detectar si hay secrets de firmado
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Firmado ad-hoc ACTIVADO"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sin secrets: se generara un IPA sin firmar (instalable con Sideloadly/AltStore)"
          fi

      - name: Instalar certificado y perfil (ad-hoc)
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euxo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "actions" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "actions" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/tm-crm-adhoc.mobileprovision"
          echo "Certificado y perfil instalados"

      - name: Archivar (build de Xcode)
        run: |
          set -o pipefail
          EXTRA_ARGS=""
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            EXTRA_ARGS="DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic"
          else
            EXTRA_ARGS="CODE_SIGNING_ALLOWED=NO"
          fi
          # shellcheck disable=SC2086
          if xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos \
              -configuration "$CONFIGURATION" \
              -archivePath "$RUNNER_TEMP/TMCRM.xcarchive" \
              $EXTRA_ARGS archive 2>&1 | tee /tmp/xcode-archive.log; then
            echo "Archive OK"
          else
            tail -c 900 /tmp/xcode-archive.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Exportar IPA firmado (ad-hoc)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TMCRM.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee /tmp/xcode-export.log; then
            echo "Export OK"
            ls -la "$RUNNER_TEMP/export"
          else
            tail -c 900 /tmp/xcode-export.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Empaquetar IPA sin firmar
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$RUNNER_TEMP/TMCRM.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/App.app"
          cd "$RUNNER_TEMP"
          zip -qr "TemploMisticoCRM-unsigned.ipa" Payload
          ls -la TemploMisticoCRM-unsigned.ipa

      - name: Copiar IPA al repositorio
        run: |
          mkdir -p ipa
          if [ -f "$RUNNER_TEMP/export/App.ipa" ]; then
            cp "$RUNNER_TEMP/export/App.ipa" ipa/templo-mistico-crm-adhoc.ipa
          fi
          if [ -f "$RUNNER_TEMP/TemploMisticoCRM-unsigned.ipa" ]; then
            cp "$RUNNER_TEMP/TemploMisticoCRM-unsigned.ipa" ipa/templo-mistico-crm-unsigned.ipa
          fi
          ls -la ipa/

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: templo-mistico-crm-ipa
          path: ipa/*.ipa

      - name: Commit del IPA a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ipa/*.ipa
          if git diff --cached --quiet; then
            echo "IPA sin cambios, nada que commitear"
          else
            git commit -m "build: IPA generado automaticamente [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
